  <circle cx="236" cy="30" r="4" fill="#000"/>
  <path d="M 248 30 L 330 48 L 248 48 Z" fill="#ffb347" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 248 48 Q 290 78 325 50" fill="#ff7f66" stroke="#222" stroke-width="2"/>
  <!-- feet on pedals -->
  <line x1="185" y1="140" x2="215" y2="195" stroke="#ffb347" stroke-width="7" stroke-linecap="round"/>
