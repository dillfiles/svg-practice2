  <ellipse cx="200" cy="275" rx="160" ry="10" fill="#a8d5a2"/>

  <!-- wheels -->
  <circle cx="120" cy="235" r="38" fill="none" stroke="#222" stroke-width="5"/>
  <circle cx="280" cy="235" r="38" fill="none" stroke="#222" stroke-width="5"/>
