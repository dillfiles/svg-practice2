  <path d="M120 235 L180 160 L260 160 L280 235 M180 160 L220 235 L120 235 M220 235 L260 160" fill="none" stroke="#2a7de1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="260" y1="160" x2="275" y2="130" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <path d="M268 125 Q280 115 292 125" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="180" y1="160" x2="172" y2="135" stroke="#222" stroke-width="5" stroke-linecap="round"/>

  <!-- pelican -->
  <ellipse cx="195" cy="105" rx="55" ry="42" fill="#ffffff" stroke="#222" stroke-width="3"/>
